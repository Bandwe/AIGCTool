name: Build AIGCTool

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag; created only after every build passes"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AIGCTool-Windows-x64
          - os: macos-15
            artifact: AIGCTool-macOS-arm64
          - os: macos-15-intel
            artifact: AIGCTool-macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - name: Install and verify native FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: python -c "from core.autoinstall import download_ffmpeg; download_ffmpeg()"
      - name: Test
        run: python -m pytest tests/ -q
      - name: Build
        run: python build.py
      - name: Packaged GUI smoke test
        run: python scripts/check_bundle.py dist
      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/AIGCTool -DestinationPath dist/${{ matrix.artifact }}.zip
      - name: Create ZIP (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/AIGCTool.app dist/${{ matrix.artifact }}.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: AIGCTool-*
          path: artifacts
          merge-multiple: true
      - name: Verify all packages and generate checksums
        run: python scripts/verify_release.py artifacts --tag "$RELEASE_TAG"
      - name: Tag the exact verified source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
      - name: Create complete release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS.txt
          --verify-tag --draft --title "AIGCTool $RELEASE_TAG"
          --notes-file RELEASE_NOTES.md
